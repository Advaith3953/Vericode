[project]
name = "vericode"
version = "0.1.0"
description = "Self-verifying software-engineering agent with a controlled evaluation harness"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "R. Advaith" }]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov>=4", "ruff>=0.4", "mypy>=1.8"]

[project.scripts]
vericode = "vericode.cli:main"

[tool.setuptools]
packages = ["vericode", "bench"]

[tool.setuptools.package-data]
bench = ["bugs/**/*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["bench/bugs"]   # intentionally buggy fixtures

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["bench/bugs", "build"]

[tool.coverage.run]
source = ["vericode", "bench"]
omit = ["bench/bugs/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true
